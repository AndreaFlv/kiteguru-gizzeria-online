name: Send Telegram forecast

on:
  schedule:
    - cron: "30 7 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiteguru-telegram-forecast
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and send two-day forecast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m cloud.send_telegram_forecast
